version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kalaipaalam-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kalaipaalam:heritage_secret@postgres:5432/kalaipaalam_db
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./backend/app/static:/app/backend/app/static

  postgres:
    image: postgres:15-alpine
    container_name: kalaipaalam-postgres
    environment:
      - POSTGRES_USER=kalaipaalam
      - POSTGRES_PASSWORD=heritage_secret
      - POSTGRES_DB=kalaipaalam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kalaipaalam-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
